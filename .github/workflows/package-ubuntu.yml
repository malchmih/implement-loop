name: Package Ubuntu executable

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build Ubuntu x86-64 archive
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Build and archive the executable
        env:
          UV_PYTHON: "3.11"
        run: |
          make build
          tar -czf build/implement-loop-ubuntu-x86_64.tar.gz -C dist implement-loop

      - name: Upload Ubuntu x86-64 artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: implement-loop-ubuntu-x86_64
          path: build/implement-loop-ubuntu-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0

  validate:
    name: Validate Ubuntu archive (${{ matrix.runner }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Download the 24.04-built archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: implement-loop-ubuntu-x86_64
          path: build/archive

      - name: Validate the archived executable
        env:
          UV_PYTHON: "3.11"
        run: |
          tar -xzf build/archive/implement-loop-ubuntu-x86_64.tar.gz -C build/archive
          IMPLEMENT_LOOP_PACKAGED_EXECUTABLE="$PWD/build/archive/implement-loop" \
            uv run --locked python -m unittest discover -s tests -p packaged_smoke.py -v

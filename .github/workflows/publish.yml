name: Publish rolling standalone prerelease

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  packaged:
    name: macOS arm64 executable
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build packaged executable archive
        uses: ./.github/actions/package-macos

      - name: Upload validated archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: implement-loop-macos-arm64
          path: build/implement-loop-macos-arm64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  packaged-ubuntu:
    name: Ubuntu x86-64 executable
    uses: ./.github/workflows/package-ubuntu.yml

  current:
    name: Check publication eligibility
    needs:
      - packaged
      - packaged-ubuntu
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip stale main builds before publication queue
        id: check
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$head_sha" == "$GITHUB_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale executable from ${GITHUB_SHA}; main is at ${head_sha}."
          fi

  publish:
    name: Publish rolling prerelease
    if: github.ref == 'refs/heads/main' && needs.current.outputs.publish == 'true'
    needs:
      - packaged
      - packaged-ubuntu
      - current
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: rolling-macos-prerelease
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Recheck main before publishing
        id: recheck
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$head_sha" == "$GITHUB_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale executable from ${GITHUB_SHA}; main is at ${head_sha}."
          fi

      - name: Download and validate packaged archives
        if: needs.current.outputs.publish == 'true' && steps.recheck.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name implement-loop-macos-arm64 \
            --dir build/release
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name implement-loop-ubuntu-x86_64 \
            --dir build/release
          for archive in build/release/implement-loop-{macos-arm64,ubuntu-x86_64}.tar.gz; do
            if [[ ! -f "$archive" || ! -s "$archive" ]] || ! tar -tzf "$archive" >/dev/null; then
              echo "Expected packaged archive is missing, empty, or invalid: $archive" >&2
              exit 1
            fi
          done

      - name: Create or update rolling prerelease
        if: needs.current.outputs.publish == 'true' && steps.recheck.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_tag=rolling
          archives=(build/release/implement-loop-macos-arm64.tar.gz build/release/implement-loop-ubuntu-x86_64.tar.gz)
          title="Rolling macOS and Ubuntu builds"
          notes="Latest successfully built and packaged-tested Apple silicon macOS and Ubuntu x86-64 executables. The Ubuntu archive is built on 24.04 and tested on 24.04 and 26.04. See the README for download and runtime requirements."

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes "$notes"
            gh release upload "$release_tag" "${archives[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$release_tag" "${archives[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "$title" \
              --notes "$notes" \
              --target "$GITHUB_SHA"
          fi

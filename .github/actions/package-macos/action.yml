name: Package macOS executable
description: Build, smoke-test, and archive the Apple silicon macOS executable.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"

    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "0.13.5"
        enable-cache: false

    - name: Build and validate the packaged executable
      shell: bash
      env:
        UV_PYTHON: "3.11"
      run: make test-packaged

    - name: Archive the executable with its permissions
      shell: bash
      run: tar -czf build/implement-loop-macos-arm64.tar.gz -C dist implement-loop

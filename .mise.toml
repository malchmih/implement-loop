[tools]
python = "latest"
uv = "0.13.5"

[tasks.setup]
description = "Synchronize the locked development environment"
run = "uv sync --locked"

[tasks.check]
description = "Run static checks and the test suite"
depends = ["setup"]
run = [
  "uv run --locked ruff check .",
  "uv run --locked ruff format --check .",
  "uv run --locked mypy",
  "uv run --locked pytest",
]

[tasks.test]
description = "Run the test suite"
depends = ["setup"]
run = "uv run --locked pytest"

[tasks.source-install]
description = "Install this checkout as an editable source command"
depends = ["setup"]
run = "uv tool install --editable --force ."
